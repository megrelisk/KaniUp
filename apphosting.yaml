# Firebase App Hosting configuration (see docs/DEPLOY.md).
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  memoryMiB: 1024

env:
  # Values from Firebase console → Project settings → Your apps → Web app.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "REPLACE_ME"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "REPLACE_ME.firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "REPLACE_ME"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "REPLACE_ME.firebasestorage.app"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "REPLACE_ME"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "REPLACE_ME"
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: "REPLACE_ME"
  - variable: APP_URL
    value: "https://REPLACE_ME.web.app"
  - variable: OWNER_EMAILS
    value: "s.kartozia@kani.ge"
  - variable: MAIL_FROM
    value: "KaniUp <kartoziasoso@gmail.com>"
  - variable: SMS_SENDER
    value: "KaniUp"
  # Secrets live in Cloud Secret Manager: `firebase apphosting:secrets:set SMTP_URL` etc.
  - variable: SMTP_URL
    secret: SMTP_URL
  - variable: CRON_SECRET
    secret: CRON_SECRET
  # Uncomment when the SMS provider's key arrives:
  # - variable: SMS_PROVIDER
  #   value: "smsoffice"
  # - variable: SMS_API_KEY
  #   secret: SMS_API_KEY
